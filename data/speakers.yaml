  title: ""
  bio: "Prof Steven Schockaert is full professor at Cardiff University and fellow of the Alan Turing Institute. He received his PhD from Ghent university and has been a postdoctoral fellow of the Research Foundation Flanders from 2008 to 2011, before joining Cardiff University. His research focuses on Natural Language Processing, Commonsense Reasoning, Representation Learning, and Neurosymbolic Artificial Intelligence. For his research works, Steven has received several awards including the ECCAI Artificial Intelligence Dissertation Award in 2008 and best paper awards. He is editor-in-chief of AI Communications and serves on the editorial board of Machine Learning and Neurosymbolic Artificial Intelligence."

