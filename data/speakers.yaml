  bio: "Steven Schockaert is a professor at Cardiff University and a Fellow of the Alan Turing Institute. He received his Ph.D. from Ghent University and was a postdoctoral fellow at the Research Foundation Flanders from 2008 to 2011 before joining Cardiff University. His research focuses on natural language processing, commonsense reasoning, representation learning, and neurosymbolic artificial intelligence. He has received several awards for his research work, including the ECCAI Artificial Intelligence Dissertation Award in 2008 and Best Paper Awards. He is the editor-in-chief of AI Communications and serves on the editorial boards of Machine Learning and Neurosymbolic Artificial Intelligence."

