- name: "Steven Schockaert"
  affiliation: "Cardiff University, UK"
  homepage: "https://profiles.cardiff.ac.uk/staff/schockaerts1"
  image: "images/profiles/steven-schockaert.webp"
  title: ""
  bio: "Steven Schockaert is a professor at Cardiff University and a Fellow of the Alan Turing Institute. He received his Ph.D. from Ghent University and was a postdoctoral fellow at the Research Foundation Flanders from 2008 to 2011 before joining Cardiff University. His research focuses on natural language processing, commonsense reasoning, representation learning, and neurosymbolic artificial intelligence. He has received several awards for his research work, including the ECCAI Artificial Intelligence Dissertation Award in 2008, the ERC Starting Grant, and several best paper awards. He is the editor-in-chief of the European Journal on Artificial Intelligence and serves on the editorial boards of Machine Learning and Neurosymbolic Artificial Intelligence."

- name: "Parisa Kordjamshidi"
  affiliation: "Michigan State University, USA"
  homepage: "https://www.cse.msu.edu/~kordjams/"
  image: "images/profiles/parisa-kordjamshidi.webp"
  title: "Spatial Reasoning: The Key to Embodied Intelligence"
  bio: "Parisa Kordjamshidi is an Associate Professor in the Department of Computer Science and Engineering at Michigan State University, US. Her research focuses on spatial language understanding, multimodal reasoning across vision and language, and neuro-symbolic learning. She received her Ph.D. from KU Leuven and conducted postdoctoral research at the University of Illinois Urbana-Champaign. She is a recipient of the NSF CAREER, Amazon Faculty Research, and Fulbright Scholar Awards. Her research team received the NAACL-2025 Outstanding Research Paper Award and EMNLP-2025 SAC highlights. Dr. Kordjamshidi serves as Associate Editor of JAIR, Co-Editor-in-Chief of ARR, and Action Editor for TACL, and has held roles on the organizing committees of major conferences including ACL, NAACL, EACL, EMNLP, ECML-PKDD, and AAAI. She was recently a visiting Associate Professor at UCLA and is currently a Visiting Professor at Bloomberg, where she is spending her sabbatical."
